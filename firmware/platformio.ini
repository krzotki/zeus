; Zeus x27 StatTrak display - Seeed XIAO ESP32-S3
; Build + upload with PlatformIO (VS Code extension or `pio run -t upload`).

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; XIAO ESP32-S3 has 8MB flash + 8MB PSRAM. PSRAM lets us parse the (large)
; Steam inventory JSON without exhausting internal RAM.
board_build.arduino.memory_type = qio_opi
; Store the event WAVs on LittleFS. Put files in firmware/data/ and flash them
; with `pio run -t uploadfs` (separate from the normal firmware upload).
board_build.filesystem = littlefs
build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1        ; Serial over native USB (Web Serial config)

  ; ---- TFT_eSPI display config (0.96" IPS 80x160, ST7735S) ----
  ; Matches the kamami 0.96" 80x160 IPS module. IPS panels usually need colour
  ; inversion ON; if the colours look wrong, comment TFT_INVERSION_ON out (or try
  ; ST7735_REDTAB160x80 / adjust offsets). Pins are XIAO GPIO (see README).
  -D USER_SETUP_LOADED
  -D USE_HSPI_PORT                     ; S3: pin TFT to SPI3. Default FSPI(0) makes
                                       ; REG_SPI_BASE(0)=0 -> SPI writes hit 0x10 -> boot panic.
  -D ST7735_DRIVER
  -D ST7735_REDTAB160x80               ; GREENTAB offset left 1-2px garbage strip on this panel
  -D TFT_WIDTH=80
  -D TFT_HEIGHT=160
  -D TFT_INVERSION_OFF                 ; this panel shows correct colours without inversion
  -D TFT_MOSI=9
  -D TFT_SCLK=7
  -D TFT_CS=2
  -D TFT_DC=3
  -D TFT_RST=-1                        ; software reset; RST wire -> 3V3 (frees GPIO4 for I2C SCL)
  ; TFT_BL intentionally unset: backlight is hardwired to 3V3 so GPIO1 is free for I2C SDA
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_GFXFF
  -D SMOOTH_FONT
  -D SPI_FREQUENCY=27000000

  ; ---- Sound (MAX98357A I2S class-D amp -> 8ohm speaker) ----
  ; Free XIAO pins; UART0 TX (GPIO43) is free because Serial runs over USB CDC.
  -D I2S_BCLK=5                        ; MAX98357A BCLK  (XIAO D4)
  -D I2S_LRC=6                         ; MAX98357A LRC   (XIAO D5)
  -D I2S_DIN=43                        ; MAX98357A DIN   (XIAO D6 / TX)

  ; ---- Tip LED (blue arc on button press) ----
  -D TIP_LED_PIN=44                    ; drives the tip LED / transistor base (XIAO D7 / RX)

  ; ---- Battery gauge 2nd screen (I2C: OLED SSD1306 + MAX17048 fuel gauge) ----
  ; SDA/SCL reclaimed from the TFT backlight + reset pins (see above).
  -D I2C_SDA=1                         ; XIAO D0 (was TFT_BL)
  -D I2C_SCL=4                         ; XIAO D3 (was TFT_RST)

  ; ---- Birthday sound: play /birthday.wav instead of /click.wav on this date ----
  ; Needs NTP time (synced after WiFi). TZ sets when local midnight rolls over.
  -D BIRTHDAY_MONTH=8
  -D BIRTHDAY_DAY=22
  -D BIRTHDAY_TZ="\"CET-1CEST,M3.5.0,M10.5.0/3\""   ; Europe/Warsaw (handles DST)

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  bblanchon/ArduinoJson @ ^7.0.4
  earlephilhower/ESP8266Audio @ ^1.9.7
  adafruit/Adafruit SSD1306 @ ^2.5.9
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit MAX1704X @ ^1.0.3
  https://github.com/tzapu/WiFiManager.git
