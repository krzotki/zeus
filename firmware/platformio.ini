; Zeus x27 StatTrak display - Seeed XIAO ESP32-S3
; Build + upload with PlatformIO (VS Code extension or `pio run -t upload`).

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; XIAO ESP32-S3 has 8MB flash + 8MB PSRAM. PSRAM lets us parse the (large)
; Steam inventory JSON without exhausting internal RAM.
board_build.arduino.memory_type = qio_opi
build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1        ; Serial over native USB (Web Serial config)

  ; ---- TFT_eSPI display config (0.96" IPS 80x160, ST7735S) ----
  ; Matches the kamami 0.96" 80x160 IPS module. IPS panels usually need colour
  ; inversion ON; if the colours look wrong, comment TFT_INVERSION_ON out (or try
  ; ST7735_REDTAB160x80 / adjust offsets). Pins are XIAO GPIO (see README).
  -D USER_SETUP_LOADED
  -D ST7735_DRIVER
  -D ST7735_GREENTAB160x80
  -D TFT_WIDTH=80
  -D TFT_HEIGHT=160
  -D TFT_INVERSION_ON                  ; 0.96" IPS typically needs this; remove if inverted
  -D TFT_MOSI=9
  -D TFT_SCLK=7
  -D TFT_CS=2
  -D TFT_DC=3
  -D TFT_RST=4
  -D TFT_BL=1
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_GFXFF
  -D SMOOTH_FONT
  -D SPI_FREQUENCY=27000000

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  bblanchon/ArduinoJson @ ^7.0.4
  https://github.com/tzapu/WiFiManager.git
